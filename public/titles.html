<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>爆款标题库</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
    <main class="page">
      <section class="hero">
        <p class="eyebrow">Video Toolkit</p>
        <div class="hero-layout">
          <div class="hero-copy">
            <h1>爆款标题库</h1>
          </div>
          <nav class="tool-nav" aria-label="工具导航">
            <a href="/" class="tool-nav-btn">小红书转文字</a>
            <a href="/creator.html" class="tool-nav-btn">博主数据</a>
            <a href="/titles.html" class="tool-nav-btn active">爆款标题库</a>
          </nav>
        </div>
      </section>

      <div class="titles-layout">
        <aside class="titles-sidebar">
          <div class="titles-sidebar-head">
            <h2>公式分类</h2>
            <button id="syncTitles" class="ghost small" type="button">同步历史记录</button>
          </div>
          <nav id="formulaNav" class="formula-nav" aria-label="公式分类"></nav>
        </aside>

        <div class="titles-main">
          <div class="titles-toolbar">
            <p id="titlesCount" class="helper"></p>
          </div>
          <div class="title-table-wrap">
            <table class="title-table" id="titleTable">
              <thead>
                <tr>
                  <th>标题</th>
                  <th>公式分类</th>
                  <th>内容类型</th>
                  <th>点赞 · 收藏 · 评论</th>
                  <th>保存时间</th>
                </tr>
              </thead>
              <tbody id="titleTableBody"></tbody>
            </table>
            <div id="titlesEmpty" class="titles-empty-state hidden">
              <p>还没有标题数据，先点击「同步历史记录」试试。</p>
            </div>
          </div>
        </div>
      </div>
      <p id="titlesStatus" class="status"></p>
    </main>

    <script src="/titles.js"></script>
  </body>
</html>
